services:
  app:
    build: .
    ports:
      - "8080:10000"
    environment:
      PORT: 10000
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nexopos
      DB_USERNAME: nexopos
      DB_PASSWORD: nexopos
      SESSION_DOMAIN: localhost
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: nexopos
      MYSQL_USER: nexopos
      MYSQL_PASSWORD: nexopos
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  storage:
